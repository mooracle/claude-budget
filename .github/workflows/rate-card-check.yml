name: rate-card sync

# Every 48h: pull current prices from Anthropic, compare against the embedded card,
# and commit if they differ — then start rate-card-release.yml, which bumps the
# last version digit and publishes a rebuilt binary.
#
#   fetch (docs table) -> compare -> commit -> dispatch release -> bump patch -> tag -> build
#
# There is no pricing API to read instead: GET /v1/models returns ids and
# capabilities but no rates, and claude.com/pricing.json is a CMS page dump whose
# " / MTok" strings are text nodes disconnected from any model name. The docs
# markdown table is the only machine-readable source, so scripts/fetch-rates.sh
# parses it behind validation that aborts on a misparse rather than writing bad
# rates (see the header comment there).
#
# Every step runs on the default GITHUB_TOKEN; no extra secrets are needed. A
# push made with that token never fires another workflow's `on: push`, which is
# why the release is started explicitly with `gh workflow run` below —
# workflow_dispatch is the documented exception to that rule.
on:
  schedule:
    # Every 48h at 07:00 UTC. Cron has no true "every 48 hours", so this is
    # odd days of the month — which means a month boundary can put two runs on
    # consecutive days (e.g. the 31st then the 1st). Harmless: a run with no
    # price change commits nothing and cuts no release.
    - cron: '0 7 */2 * *'
  workflow_dispatch:

permissions:
  contents: write # push the refreshed card
  actions: write  # start rate-card-release.yml

concurrency:
  group: rate-card-sync
  cancel-in-progress: false

jobs:
  sync:
    name: refresh prices and rebuild if they changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fetch current rates
        run: ./scripts/fetch-rates.sh

      - name: Did the card change?
        id: card
        run: |
          set -euo pipefail
          if git diff --quiet -- data/claude-pricing.json; then
            echo "rates unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat -- data/claude-pricing.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rates are about to ship into permanent commit trailers, so the card is
      # validated before it lands: positive rates, every model priceable, every
      # fallbacks target present.
      - name: Test
        if: steps.card.outputs.changed == 'true'
        run: |
          go vet ./...
          go test ./...

      - name: Commit the refreshed card
        if: steps.card.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/claude-pricing.json
          git commit -m "chore: refresh rate card ($(jq -r .version data/claude-pricing.json))

          Prices pulled from the Anthropic pricing docs by
          .github/workflows/rate-card-check.yml. If a newly added model is now
          its family's current generation, repoint \`fallbacks\` at it."
          # Push back to whichever ref triggered this run, not a hardcoded main:
          # on the schedule that is main, and a workflow_dispatch on a branch
          # then stays on that branch instead of silently writing to main.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # The commit above was pushed with GITHUB_TOKEN, so rate-card-release.yml's
      # `on: push` never sees it (this is what stalled the 2026-08-13 refresh at
      # a commit with no release). Start it by hand on the ref we just pushed;
      # it re-reads the card diff itself and bumps/tags from there.
      - name: Start the release
        if: steps.card.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run rate-card-release.yml --ref "$GITHUB_REF_NAME"
